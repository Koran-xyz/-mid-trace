<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIY.MID Studio</title><style>body{margin:0;background:#10111b;color:#f5f1e8;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.brand{color:#f6c964;font-weight:900;letter-spacing:.18em}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0;position:sticky;top:0;background:#10111bf2;padding:8px 0}.tab,.opt{border:1px solid #ffffff1f;background:#171926;color:#ffffffa0;border-radius:12px;padding:11px;font-weight:800}.tab.active,.opt.active{background:#f6c964;color:#171621}.pane{display:none}.pane.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#191b2b;border:1px solid #ffffff1a;border-radius:20px;padding:16px}.field{margin-top:13px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}textarea,input,select{width:100%;box-sizing:border-box;border:1px solid #ffffff1f;background:#0e1019;color:#fff;border-radius:12px;padding:11px;font:inherit}textarea{min-height:80px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.make,.copy{width:100%;border:0;border-radius:12px;padding:13px;font-weight:900}.make{margin-top:14px;background:#f6c964;color:#171621}.output{background:#f5f1e8;color:#171717}.prompt{min-height:220px;background:#e9e1d4;border-radius:12px;padding:12px;white-space:pre-wrap;font:12px/1.65 ui-monospace,monospace}.copy{margin-top:9px;background:#171717;color:#fff}.upload{position:relative;height:150px;border:1px dashed #ffffff40;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#ffffff99}.upload input{position:absolute;inset:0;opacity:0}.upload img{width:100%;height:100%;object-fit:contain}.full{grid-column:1/-1}.note{font-size:11px;color:#ffffff8f}@media(max-width:760px){.grid{grid-template-columns:1fr}.options{grid-template-columns:repeat(2,1fr)}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="brand">MIY.MID STUDIO v0.2</div><h1>作る・合成する・動かす</h1><div class="note">上のタブで切り替え。必要な機能だけ表示。</div><div class="tabs"><button class="tab active" data-pane="p1">プロンプト</button><button class="tab" data-pane="p2">合成</button><button class="tab" data-pane="p3">動画</button></div><section id="p1" class="pane active"><div class="grid"><div class="card"><h3>静止画プロンプト</h3><div class="field"><label>何を作る？</label><textarea id="psub"></textarea></div><div class="field"><label>構成・場所・空気</label><textarea id="pworld"></textarea></div><div class="field"><label>固定したいもの</label><textarea id="pfixed"></textarea></div><div class="field"><label>画風</label><select id="pstyle"><option>Cinematic realism</option><option>Clean commercial photography</option><option>Neon noir</option><option>Dreamy editorial</option><option>Contemporary fine art</option></select></div><div class="field"><label>表示したい文字</label><input id="ptext"></div><div class="field"><label>自由コメント</label><textarea id="pcomment" placeholder="構図修正・色・雰囲気など"></textarea></div><button class="make" id="pmake">プロンプト生成</button></div><div class="card output"><h3>OUTPUT</h3><div id="pout" class="prompt">入力して生成。</div><button class="copy" data-copy="pout">コピー</button></div></div></section><section id="p2" class="pane"><div class="grid"><div class="card"><h3>1枚目：主役</h3><div class="upload"><span id="e1">画像を選ぶ</span><img id="i1" hidden><input id="f1" type="file" accept="image/*"></div><div class="field"><label>全体の画風</label><div class="options" id="paint"><button class="opt active" data-k="photo">写真風</button><button class="opt" data-k="oil">油絵</button><button class="opt" data-k="watercolor">水彩</button><button class="opt" data-k="acrylic">アクリル</button><button class="opt" data-k="sumi">墨絵</button><button class="opt" data-k="pastel">パステル</button></div></div></div><div class="card"><h3>2枚目：エフェクト</h3><div class="upload"><span id="e2">画像を選ぶ</span><img id="i2" hidden><input id="f2" type="file" accept="image/*"></div><div class="field"><label>表現</label><div class="options" id="contour"><button class="opt active" data-k="glass">ガラスのひび</button><button class="opt" data-k="string">紐</button><button class="opt" data-k="vine">蔦</button><button class="opt" data-k="lightning">稲妻</button><button class="opt" data-k="neon">ネオン</button><button class="opt" data-k="ink">インク</button></div></div><div class="field"><label>強さ</label><div class="options" id="strength"><button class="opt" data-k="weak">弱</button><button class="opt active" data-k="medium">中</button><button class="opt" data-k="strong">強</button></div></div><div class="field"><label>距離</label><div class="options" id="depth"><button class="opt" data-k="back">奥</button><button class="opt active" data-k="same">同位置</button><button class="opt" data-k="middle">中間</button><button class="opt" data-k="front">手前</button></div></div><button class="make" id="cmake" disabled>合成プロンプト生成</button></div><div class="card output full"><h3>COMPOSITE OUTPUT</h3><div id="cout" class="prompt">画像を2枚選ぶと作れます。</div><button class="copy" data-copy="cout">コピー</button></div></div></section><section id="p3" class="pane"><div class="grid"><div class="card"><h3>動画エフェクト</h3><div class="field"><label>作りたいもの</label><textarea id="vsub"></textarea></div><div class="field"><label>場所・空気・世界観</label><textarea id="vworld"></textarea></div><div class="field"><label>役割</label><div class="options" id="role"><button class="opt active" data-k="Opening clip">Opening</button><button class="opt" data-k="Ending clip">Ending</button><button class="opt" data-k="Loop clip">Loop</button></div></div><div class="field"><label>動き</label><textarea id="vmotion"></textarea></div><div class="field"><label>エフェクト</label><select id="veffect"><option>None</option><option>Saber-style neon trail</option><option>Glitch</option><option>Brush reveal</option><option>Screen shatter</option><option>Particle burst</option><option>Swipe transition</option></select></div><div class="field"><label>表示したい文字</label><input id="vtext"></div><div class="field"><label>自由コメント</label><textarea id="vcomment"></textarea></div><button class="make" id="vmake">動画プロンプト生成</button></div><div class="card output"><h3>VIDEO OUTPUT</h3><div id="vout" class="prompt">入力して生成。</div><button class="copy" data-copy="vout">コピー</button></div></div></section></div><script>(()=>{const $=x=>document.getElementById(x),val=x=>$(x).value.trim();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.pane).classList.add('active')});function group(id,set){const g=$(id);g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{g.querySelectorAll('.opt').forEach(x=>x.classList.remove('active'));b.classList.add('active');set(b.dataset.k)})}document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText($(b.dataset.copy).textContent);b.textContent='コピーしました';setTimeout(()=>b.textContent='コピー',900)}catch{alert('長押しでコピーしてください')}});$('pmake').onclick=()=>{const a=[];if(val('psub'))a.push('Subject and purpose: '+val('psub')+'.');if(val('pworld'))a.push('Composition and atmosphere: '+val('pworld')+'.');if(val('pfixed'))a.push('Keep consistent: '+val('pfixed')+'.');a.push('Style: '+$('pstyle').value+'.');if(val('ptext'))a.push('Exact on-screen text: "'+val('ptext')+'".');if(val('pcomment'))a.push('Additional direction: '+val('pcomment')+'.');$('pout').textContent=a.join(' ')};const paints={photo:'photorealistic, natural light and materials',oil:'strong oil painting, visible brushstrokes',watercolor:'watercolor painting, pigment washes and paper texture',acrylic:'acrylic painting, bold opaque strokes',sumi:'Japanese sumi-e ink painting',pastel:'soft pastel artwork'};const contours={glass:'thin cracked-glass contour lines',string:'thin string contour lines',vine:'slender vine contour lines',lightning:'fine lightning contour lines',neon:'luminous neon contour lines',ink:'flowing ink contour lines'};const strengths={weak:'subtle and sparse',medium:'clearly visible but secondary',strong:'bold and unmistakable'};const depths={back:'in front of Image 1 as a transparent foreground layer',same:'on the same visual plane as Image 1',middle:'in the middle ground',front:'behind Image 1 in the background'};let c={paint:'photo',contour:'glass',strength:'medium',depth:'same',a:false,b:false};group('paint',v=>c.paint=v);group('contour',v=>c.contour=v);group('strength',v=>c.strength=v);group('depth',v=>c.depth=v);function load(f,img,empty,cb){const x=f.files&&f.files[0];if(!x)return;const r=new FileReader();r.onload=()=>{img.src=r.result;img.hidden=false;empty.hidden=true;cb()};r.readAsDataURL(x)};$('f1').onchange=()=>load($('f1'),$('i1'),$('e1'),()=>{c.a=true;$('cmake').disabled=!(c.a&&c.b)});$('f2').onchange=()=>load($('f2'),$('i2'),$('e2'),()=>{c.b=true;$('cmake').disabled=!(c.a&&c.b)});$('cmake').onclick=()=>{$('cout').textContent=['One unified composition. Image 1 is the primary world and main subject.','Image 2 is an effect only, not a second full subject. Use only its silhouette and key contour lines.','Render Image 2 as '+contours[c.contour]+', '+strengths[c.strength]+'. Keep the effect localized to its contour paths.','Render the entire final image as '+paints[c.paint]+'.','Place the Image 2 effect '+depths[c.depth]+'.','Finish as contemporary modern art.'].join(' ')};let role='Opening clip';group('role',v=>role=v);$('vmake').onclick=()=>{const a=['Five-second cinematic video.'];if(val('vsub'))a.push('Concept: '+val('vsub')+'.');if(val('vworld'))a.push('Overall composition and atmosphere: '+val('vworld')+'.');if(val('vmotion'))a.push('Motion and camera direction: '+val('vmotion')+'.');a.push('Clip role: '+role+'. Transition or effect: '+$('veffect').value+'.');if(val('vtext'))a.push('Exact on-screen text: "'+val('vtext')+'".');if($('veffect').value==='Saber-style neon trail')a.push('Use luminous plasma/neon edges on the title or important subject contours.');if(val('vcomment'))a.push('Additional direction: '+val('vcomment')+'.');$('vout').textContent=a.join(' ')}})();</script></body></html>

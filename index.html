<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>MIY.MID Studio</title><style>:root{--bg:#0b0d12;--panel:#141821;--panel2:#1b202b;--line:#2c3442;--text:#f6f8fc;--muted:#a9b1bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:16px 12px 96px}h1{font-size:25px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}select,input,textarea,button{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 12px;font:inherit}textarea{min-height:72px;resize:vertical}button{cursor:pointer}.primary{background:#fff;color:#000;font-weight:800}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{width:auto;border-radius:999px;padding:8px 11px}.chip.active{background:#fff;color:#000;font-weight:800}.output{background:#10141b;border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;line-height:1.55}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(11,13,18,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}.bottomInner{max-width:920px;margin:auto;padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px}.bottomInner button{flex:1}</style></head><body><div class="wrap"><h1>MIY.MID Studio</h1><div class="sub">静止画＋静止画 → 動画演出。演出させる為のツール。</div><section class="card"><h2>クイック演出</h2><div id="quick" class="chips"></div></section><section class="card"><h2>1. 5秒の流れ</h2><div class="grid3"><div><label>初め</label><select id="begin"><option>すぐ動き始める</option><option>奥から現れる</option><option>左右から集まる</option><option>中央から広がる</option></select></div><div><label>中盤</label><select id="middle"><option>被写体を包む</option><option>手前へ迫る</option><option>崩壊する</option><option>再構築する</option><option>エフェクトを最大にする</option></select></div><div><label>終盤</label><select id="end"><option>発光して止まる</option><option>白フラッシュで終わる</option><option>奥へ消える</option><option>完成状態を残す</option></select></div></div></section><section class="card"><h2>2. エフェクト</h2><div id="effects" class="chips"></div><div style="height:10px"></div><div class="grid3"><div><label>作用する場所</label><select id="effectTarget"><option>全体</option><option>人物</option><option>文字</option><option>全体輪郭</option></select></div><div><label>量</label><select id="amount"><option>少なめ</option><option selected>標準</option><option>多め</option><option>MAX</option></select></div><div><label>速度</label><select id="speed"><option>ゆっくり</option><option selected>標準</option><option>速い</option><option>即発動</option></select></div><div><label>動き・向き</label><select id="direction"><option>中央</option><option>左から右</option><option>右から左</option><option>奥から手前</option><option>手前から奥</option><option>横回転</option><option>縦回転</option><option>左右に広がる</option><option>上下に広がる</option><option>中央へ集まる</option><option>全方向に広がる</option><option>渦巻く</option></select></div><div><label>エフェクト色</label><select id="effectColor"><option>指定なし</option><option>青</option><option>青紫</option><option>赤</option><option>白</option><option>白＋金</option><option>紫</option><option>緑</option><option>虹色</option></select></div><div><label>色の細部</label><select id="colorDetail"><option>指定なし</option><option>先端だけ白</option><option>中心だけ白</option><option>輪郭だけ発光</option><option>中心から外へ色変化</option><option>外側ほど暗く</option></select></div></div></section><section class="card"><h2>3. 見せ方</h2><div class="grid"><div><label>雰囲気</label><select id="mood"><option>シネマ風</option><option>派手</option><option>神秘的</option><option>近未来</option><option>壮大</option></select></div><div><label>強さ</label><select id="strength"><option>標準</option><option>強め</option><option>やりすぎ</option></select></div></div></section><section class="card"><h2>4. テキスト合成</h2><div class="grid"><div><label>表示する文字</label><input id="textContent" placeholder="例：MIY.MID"></div><div><label>文字の種類</label><select id="fontType"><option>ゴシック</option><option>明朝</option><option>手書き風</option><option>近未来</option><option>重厚</option><option>細身</option></select></div><div><label>文字の太さ</label><select id="fontWeight"><option>細い</option><option selected>標準</option><option>太い</option><option>極太</option></select></div><div><label>文字の形状</label><select id="fontShape"><option>通常</option><option>角ばり</option><option>丸み</option><option>縦長</option><option>横長</option><option>崩れ</option><option>ひび割れ</option><option>ネオン管風</option></select></div><div><label>文字エフェクト</label><select id="textStyle"><option>なし</option><option>セイバー（ネオン光線）</option><option>発光</option><option>グリッチ</option><option>輪郭発光</option></select></div><div><label>位置</label><select id="textPosition"><option>中央</option><option>上</option><option>下</option></select></div><div><label>出るタイミング</label><select id="textTiming"><option>最初から</option><option>途中から</option><option>終盤から</option></select></div><div><label>出現方法</label><select id="textMotion"><option>その場に出て固定</option><option>フェードインして固定</option><option>光で描いて固定</option><option>グリッチ出現して固定</option></select></div><div><label>消え方</label><select id="textExit"><option>固定</option><option>フェードアウト</option><option>全体に散らばる</option></select></div></div></section><section class="card"><details><summary>細かい設定</summary><div style="height:10px"></div><div class="grid"><div><label>二枚目</label><select id="secondImage"><option>使う</option><option>使わない</option></select></div><div><label>ループ</label><select id="loop"><option>しない</option><option>自然につなぐ</option></select></div></div></details></section><section class="card"><h2>英語プロンプト</h2><div id="output" class="output"></div></section></div><div class="bottom"><div class="bottomInner"><button id="generate" class="primary">生成</button><button id="copy">コピー</button></div></div><script>const FX=['粒子','発光','セイバー（ネオン光線）','エネルギーライン','グリッチ','残像','崩壊','再構築','煙・霧','火花・炎','フラッシュ','衝撃波','オーラ','電撃'];const PRE=[{n:'覚醒',fx:['発光','オーラ','エネルギーライン'],b:'すぐ動き始める',m:'被写体を包む',e:'発光して止まる',a:'多め',s:'速い',d:'左右に広がる',mo:'シネマ風',st:'強め'},{n:'爆発',fx:['フラッシュ','衝撃波','火花・炎'],b:'中央から広がる',m:'エフェクトを最大にする',e:'白フラッシュで終わる',a:'MAX',s:'即発動',d:'全方向に広がる',mo:'派手',st:'やりすぎ'},{n:'神秘',fx:['煙・霧','粒子','発光'],b:'奥から現れる',m:'被写体を包む',e:'奥へ消える',a:'標準',s:'標準',d:'渦巻く',mo:'神秘的',st:'標準'},{n:'高速',fx:['残像','セイバー（ネオン光線）','エネルギーライン'],b:'奥から現れる',m:'手前へ迫る',e:'完成状態を残す',a:'多め',s:'速い',d:'奥から手前',mo:'近未来',st:'強め'}];const EN={'すぐ動き始める':'start moving immediately','奥から現れる':'emerge from depth','左右から集まる':'converge from both sides','中央から広がる':'expand from the center','被写体を包む':'wrap around the subject','手前へ迫る':'rush toward the camera','崩壊する':'break apart','再構築する':'rebuild','エフェクトを最大にする':'push effects to maximum intensity','発光して止まる':'hold on a glowing final frame','白フラッシュで終わる':'end on a white flash','奥へ消える':'fade into the distance','完成状態を残す':'hold the completed final state','粒子':'particles','発光':'glow','セイバー（ネオン光線）':'Saber-style neon light trails','エネルギーライン':'energy trails','グリッチ':'glitch','残像':'afterimages','崩壊':'shattering','再構築':'reconstruction','煙・霧':'smoke and fog','火花・炎':'sparks and fire','フラッシュ':'flash','衝撃波':'shockwave','オーラ':'aura','電撃':'electric arcs','少なめ':'light','標準':'medium','多め':'heavy','MAX':'maximum','ゆっくり':'slow','速い':'fast','即発動':'instant','中央':'centered','左から右':'move from left to right','右から左':'move from right to left','奥から手前':'move from background toward foreground','手前から奥':'move from foreground into depth','横回転':'rotate horizontally around the subject','縦回転':'rotate vertically around the subject','左右に広がる':'spread outward to the left and right','上下に広がる':'spread upward and downward','中央へ集まる':'converge toward the center','全方向に広がる':'expand in all directions','渦巻く':'spiral around the subject','シネマ風':'cinematic','派手':'bold and flashy','神秘的':'mystical','近未来':'futuristic','壮大':'epic','強め':'strong','やりすぎ':'extreme','全体':'entire frame','人物':'main person or subject','文字':'on-screen text','全体輪郭':'outer contours of the full scene','指定なし':'unspecified','青':'blue','青紫':'blue-violet','赤':'red','白':'white','白＋金':'white and gold','紫':'purple','緑':'green','虹色':'rainbow spectrum','先端だけ白':'white only at the tips','中心だけ白':'white only at the center','輪郭だけ発光':'glow only along the outlines','中心から外へ色変化':'color gradient from the center outward','外側ほど暗く':'darker toward the outer edges','ゴシック':'bold sans-serif','明朝':'serif with elegant Japanese Mincho character','手書き風':'handwritten style','近未来':'futuristic typography','重厚':'heavy monumental typography','細身':'slender typography','細い':'thin','太い':'bold','極太':'extra bold','通常':'standard proportions','角ばり':'angular geometric shape','丸み':'rounded shape','縦長':'tall condensed shape','横長':'wide extended shape','崩れ':'distressed fragmented shape','ひび割れ':'cracked shape','ネオン管風':'neon tube shape','なし':'clean text','上':'top','下':'bottom','最初から':'from the beginning','途中から':'appear midway through the clip','終盤から':'appear near the ending','その場に出て固定':'appear in place and remain fixed','フェードインして固定':'fade in and remain fixed','光で描いて固定':'draw on with luminous strokes and remain fixed','グリッチ出現して固定':'appear with a glitch reveal and remain fixed','固定':'remain visible and fixed','フェードアウト':'fade out','全体に散らばる':'scatter outward across the frame','輪郭発光':'glowing outline'};const en=v=>EN[v]||v;function setFx(arr){document.querySelectorAll('[data-fx]').forEach(b=>b.classList.toggle('active',arr.includes(b.dataset.fx)))}function getFx(){return[...document.querySelectorAll('[data-fx].active')].map(b=>b.dataset.fx)}FX.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=x;b.dataset.fx=x;b.onclick=()=>b.classList.toggle('active');effects.appendChild(b)});PRE.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=p.n;b.onclick=()=>{setFx(p.fx);begin.value=p.b;middle.value=p.m;end.value=p.e;amount.value=p.a;speed.value=p.s;direction.value=p.d;mood.value=p.mo;strength.value=p.st};quick.appendChild(b)});function make(){const fx=getFx().map(en).join(', ')||'cinematic visual effects';const txt=textContent.value.trim();const textPart=txt?` Exact on-screen text: "${txt}". Typography: ${en(fontType.value)}, ${en(fontWeight.value)}, ${en(fontShape.value)}. Text effect: ${en(textStyle.value)}. Position: ${en(textPosition.value)}. Timing: ${en(textTiming.value)}. Entrance: ${en(textMotion.value)}. Ending: ${en(textExit.value)}.`:'';const p=`Five-second cinematic sequence. Beginning: ${en(begin.value)}. Middle: ${en(middle.value)}. Ending: ${en(end.value)}. Visual effects: ${fx}. Apply effects to: ${en(effectTarget.value)}. Effect amount: ${en(amount.value)}. Effect speed: ${en(speed.value)}. Effect motion: ${en(direction.value)}. Effect color: ${en(effectColor.value)}. Color detail: ${en(colorDetail.value)}. Mood: ${en(mood.value)}. Intensity: ${en(strength.value)}.${textPart} ${secondImage.value==='使う'?'Transition clearly from the first still image toward the second still image.':''} ${loop.value==='自然につなぐ'?'Finish in a way that can loop naturally.':''} Keep motion immediate, the main payoff clear, and the ending visually readable.`;output.textContent=p;return p}generate.onclick=make;copy.onclick=async()=>navigator.clipboard.writeText(output.textContent||make());quick.children[0]?.click();</script></body></html>
